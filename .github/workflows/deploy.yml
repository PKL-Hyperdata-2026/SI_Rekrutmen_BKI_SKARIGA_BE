name: Deploy Backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, mbstring, fileinfo, bcmath, gd, zip, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run test suite
        run: composer test

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Verify production cache commands
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan optimize:clear

  deploy:
    name: Deploy to production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ssh-agent and load deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

      - name: Pin server host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "Host key could not be retrieved for $SSH_HOST"
            exit 1
          fi

      - name: Enable maintenance mode
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan down --retry=15'

      - name: Sync application source
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -az --delete --no-owner --no-group \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=storage \
            --exclude=rr \
            --exclude=.rr.yaml \
            --exclude=public/build \
            --exclude=public/storage \
            --exclude=bootstrap/cache \
            ./ "$SSH_USER@$SSH_HOST:/var/www/si-rekrutmen/backend/"

      - name: Install PHP dependencies
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist'

      - name: Run database migrations
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan migrate --force'

      - name: Compile Blade views
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan view:cache'

      - name: Install front-end dependencies
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && npm ci'

      - name: Build front-end assets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && npm run build'

      - name: Cache configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan config:cache'

      - name: Reload Octane workers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan octane:reload'

      - name: Restart queue workers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan queue:restart'

      - name: Restart Reverb server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan reverb:restart'

      - name: Disable maintenance mode
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/si-rekrutmen/backend && php artisan up'
